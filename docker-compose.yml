version: '3.8'

services:
  wejoinlife-dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    container_name: wejoinlife-dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"   # React Frontend (Vite Dev Server)
      - "8080:8080"   # Spring Boot Backend API
    environment:
      # Database Configuration
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-3299}
      - DB_NAME=${DB_NAME:-vconnect_prod_portal}
      - DB_USERNAME=${DB_USERNAME:-devdb}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - SPRING_DATASOURCE_URL=jdbc:mysql://${DB_HOST:-host.docker.internal}:${DB_PORT:-3299}/${DB_NAME:-vconnect_prod_portal}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-devdb}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-}
      # Security & JWT Configuration
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      - JWT_COOKIE_DOMAIN=${JWT_COOKIE_DOMAIN:-}
      - JWT_COOKIE_NAME=${JWT_COOKIE_NAME:-wjl_jwt}
      - CLIENT_PASS_SALT=${CLIENT_PASS_SALT:-38fc4120}
      # Multi-Database Mapping
      - PORTAL_DB=${PORTAL_DB:-vconnect_prod_portal}
      - CATALOG_DB=${CATALOG_DB:-vconnect_prod_catalog}
      - VCONNECT_DB=${VCONNECT_DB:-vconnect}
      - CART_COOKIE_NAME=${CART_COOKIE_NAME:-vconnect_cart}
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true # File change detection on Windows mounts
    volumes:
      # Sync source code folders for live dev editing
      - ./frontend:/app/frontend
      - ./backend:/app/backend
      - ./dev-start.sh:/app/dev-start.sh
      - ./.env:/app/.env
      # Prevent container build files from conflicting with host & cache Maven repo
      - /app/frontend/node_modules
      - /app/backend/target
      - maven-repo:/root/.m2
      - ./uploads:/opt/uploads
    networks:
      - wjl-network
    command: /app/dev-start.sh
    entrypoint: ["/bin/bash", "-c", "cp /app/dev-start.sh /tmp/dev-start.sh && sed -i 's/\\r$$//' /tmp/dev-start.sh && chmod +x /tmp/dev-start.sh && /tmp/dev-start.sh"]

networks:
  wjl-network:
    name: wjl-network
    driver: bridge

volumes:
  maven-repo: