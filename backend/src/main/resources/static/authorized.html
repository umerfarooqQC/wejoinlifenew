<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorized Portal | WeJoinLife Spring Boot & React SSO</title>
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- React 18 and Babel for instant in-browser execution -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --bg-base: #0a0e17;
            --bg-card: rgba(18, 24, 38, 0.75);
            --bg-card-hover: rgba(24, 32, 50, 0.85);
            --border-card: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(56, 189, 248, 0.25);
            --accent-primary: #0284c7;
            --accent-glow: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #2563eb 50%, #7c3aed 100%);
            --accent-emerald: #10b981;
            --accent-rose: #f43f5e;
            --accent-amber: #f59e0b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --text-subtle: #64748b;
            --code-bg: #030712;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(124, 58, 237, 0.10) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(16, 185, 129, 0.05) 0px, transparent 60%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Top Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 36px;
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-card);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
        }

        .brand-badge {
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sso-pill {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 4px 10px;
            border-radius: 9999px;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-glow);
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 9px 18px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Plus Jakarta Sans', sans-serif;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            border: 1px solid transparent;
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-card);
            color: var(--text-main);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-danger {
            background: rgba(244, 63, 94, 0.12);
            color: var(--accent-rose);
            border: 1px solid rgba(244, 63, 94, 0.3);
        }

        .btn-danger:hover {
            background: rgba(244, 63, 94, 0.25);
            border-color: var(--accent-rose);
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 24px;
            flex: 1;
            width: 100%;
        }

        /* Glass Card */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: border-color 0.25s ease;
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* Header Hero */
        .hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 32px;
        }

        .hero-title {
            font-family: 'Outfit', sans-serif;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .hero-subtitle {
            color: var(--text-muted);
            font-size: 15px;
            margin-top: 6px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .status-badge.authenticated {
            background: rgba(16, 185, 129, 0.12);
            color: var(--accent-emerald);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-badge.unauthenticated {
            background: rgba(244, 63, 94, 0.12);
            color: var(--accent-rose);
            border: 1px solid rgba(244, 63, 94, 0.3);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px currentColor;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        /* Metric Grid */
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .metric-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--accent-gradient);
            opacity: 0.8;
        }

        .metric-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-subtle);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .metric-value {
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            word-break: break-all;
        }

        .metric-sub {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Code & Inspect Box */
        .code-container {
            background: var(--code-bg);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 10px;
            padding: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #38bdf8;
            overflow-x: auto;
            max-height: 320px;
        }

        .code-title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* Step Timeline */
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 16px;
        }

        .timeline-step {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-card);
            border-radius: 10px;
        }

        .step-num {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-glow);
            font-weight: 700;
            font-size: 13px;
            flex-shrink: 0;
        }

        .step-title {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-main);
        }

        .step-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Unauthenticated Splash */
        .splash-unauth {
            text-align: center;
            padding: 60px 20px;
            max-width: 600px;
            margin: 60px auto;
        }

        .splash-icon {
            font-size: 48px;
            margin-bottom: 16px;
            display: inline-block;
            padding: 20px;
            border-radius: 50%;
            background: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.25);
        }

        .splash-title {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .splash-text {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 28px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function AuthorizedPortal() {
            const [authState, setAuthState] = useState({
                loading: true,
                authenticated: false,
                user: null,
                cookiePresent: false,
                cookieString: '',
                error: null
            });

            const [inMemoryToken, setInMemoryToken] = useState(null);
            const [apiTestResult, setApiTestResult] = useState(null);
            const [isTestingApi, setIsTestingApi] = useState(false);

            // 1. On Mount: Query Spring Boot /me endpoint with credentials: 'include' (Cookie-to-Bearer Handshake)
            const checkSession = async () => {
                setAuthState(prev => ({ ...prev, loading: true, error: null }));
                try {
                    // Check local document cookies
                    const cookies = document.cookie;
                    const hasWjlJwt = cookies.includes('wjl_jwt') || cookies.includes('access_token');

                    const response = await fetch('/wjlapi/api/v1/auth/me', {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json'
                        },
                        credentials: 'include' // Transmits the wjl_jwt cookie to initiate handshake
                    });

                    if (response.ok) {
                        const userData = await response.json();
                        // Store the returned access token purely in JavaScript memory (NOT localStorage)
                        if (userData.accessToken) {
                            setInMemoryToken(userData.accessToken);
                        }
                        setAuthState({
                            loading: false,
                            authenticated: userData.authenticated,
                            user: userData,
                            cookiePresent: hasWjlJwt,
                            cookieString: cookies || '(Cookie marked HttpOnly or stored under root domain)',
                            error: null
                        });
                    } else {
                        // 401 Unauthorized
                        setInMemoryToken(null);
                        setAuthState({
                            loading: false,
                            authenticated: false,
                            user: null,
                            cookiePresent: hasWjlJwt,
                            cookieString: cookies,
                            error: `Session check returned HTTP ${response.status} (Unauthorized)`
                        });
                    }
                } catch (err) {
                    setInMemoryToken(null);
                    setAuthState({
                        loading: false,
                        authenticated: false,
                        user: null,
                        cookiePresent: false,
                        cookieString: document.cookie,
                        error: err.message
                    });
                }
            };

            useEffect(() => {
                checkSession();
            }, []);

            // Handle Logout: Calls Spring Boot /logout to clear wjl_jwt cookie
            const handleLogout = async () => {
                try {
                    await fetch('/wjlapi/api/v1/auth/logout', {
                        method: 'POST',
                        credentials: 'include'
                    });
                } catch (e) {
                    console.error('Logout error:', e);
                } finally {
                    setInMemoryToken(null);
                    localStorage.removeItem('accessToken');
                    window.location.href = '/login.html';
                }
            };

            // Live API Test using Authorization: Bearer <in_memory_token>
            const testBearerApi = async () => {
                setIsTestingApi(true);
                try {
                    const headers = {
                        'Accept': 'application/json'
                    };
                    if (inMemoryToken) {
                        headers['Authorization'] = `Bearer ${inMemoryToken}`;
                    }

                    const res = await fetch('/wjlapi/api/v1/auth/me', {
                        method: 'GET',
                        headers: headers
                        // Notice: no credentials required here if backend receives Authorization: Bearer!
                    });
                    const data = await res.json();
                    setApiTestResult({
                        mode: 'Authorization: Bearer <in_memory_token>',
                        status: res.status,
                        ok: res.ok,
                        timestamp: new Date().toLocaleTimeString(),
                        sentHeader: headers['Authorization'] ? headers['Authorization'].substring(0, 35) + '...' : 'None',
                        data: data
                    });
                } catch (err) {
                    setApiTestResult({
                        mode: 'Authorization: Bearer <in_memory_token>',
                        status: 'Error',
                        ok: false,
                        timestamp: new Date().toLocaleTimeString(),
                        data: { error: err.message }
                    });
                } finally {
                    setIsTestingApi(false);
                }
            };

            if (authState.loading) {
                return (
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: '80vh', flexDirection: 'column', gap: '16px' }}>
                        <div style={{ width: '40px', height: '40px', border: '3px solid rgba(56, 189, 248, 0.2)', borderTopColor: '#38bdf8', borderRadius: '50%', animation: 'spin 1s linear infinite' }} />
                        <span style={{ color: 'var(--text-muted)', fontSize: '14px' }}>Verifying JWT Session from Cookie...</span>
                        <style>{`@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }`}</style>
                    </div>
                );
            }

            // UNAUTHENTICATED STATE
            if (!authState.authenticated) {
                return (
                    <div>
                        <header className="navbar">
                            <a href="#" className="navbar-brand">
                                <span className="brand-badge">WeJoinLife</span>
                                <span className="sso-pill">React + Spring Boot SSO</span>
                            </a>
                            <a href="/login.html" className="btn btn-primary">Go to Login</a>
                        </header>
                        <div className="container">
                            <div className="card splash-unauth">
                                <div className="splash-icon">🔒</div>
                                <h1 className="splash-title">Access Restricted</h1>
                                <p className="splash-text">
                                    No valid <code>wjl_jwt</code> authentication cookie was detected for this session. 
                                    Please authenticate through the J2EE login portal to receive your cross-app JWT cookie.
                                </p>
                                <div style={{ display: 'flex', justifyContent: 'center', gap: '12px' }}>
                                    <a href="/login.html" className="btn btn-primary">
                                        👉 Login on J2EE Portal
                                    </a>
                                    <button onClick={checkSession} className="btn btn-outline">
                                        🔄 Retry Verification
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // AUTHENTICATED STATE
            const user = authState.user;
            return (
                <div>
                    <!-- Navbar -->
                    <header className="navbar">
                        <div className="navbar-brand">
                            <span className="brand-badge">WeJoinLife</span>
                            <span className="sso-pill">React Authorized Portal</span>
                        </div>
                        <div className="navbar-actions">
                            <span style={{ fontSize: '13px', color: 'var(--text-muted)' }}>
                                Signed in as <strong style={{ color: 'white' }}>{user.email}</strong>
                            </span>
                            <a href="/login.html" className="btn btn-outline" style={{ fontSize: '12px' }}>
                                🔙 Back to Login Screen
                            </a>
                            <button onClick={handleLogout} className="btn btn-danger">
                                Sign Out
                            </button>
                        </div>
                    </header>

                    <!-- Main Body -->
                    <main className="container">
                        <!-- Hero Section -->
                        <div className="hero">
                            <div>
                                <h1 className="hero-title">Welcome to Authorized Workspace</h1>
                                <p className="hero-subtitle">
                                    Single Sign-On authentication verified seamlessly via the shared JWT cookie.
                                </p>
                            </div>
                            <div className="status-badge authenticated">
                                <span className="status-dot"></span>
                                Authenticated Session Active
                            </div>
                        </div>

                        <!-- 4 Metric Cards including In-Memory Token -->
                        <div className="grid-3" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))' }}>
                            <div className="metric-card">
                                <div className="metric-label">User Identity & Email</div>
                                <div className="metric-value">{user.email || 'N/A'}</div>
                                <div className="metric-sub">Client ID: #{user.clientId || 'Unknown'}</div>
                            </div>

                            <div className="metric-card">
                                <div className="metric-label">Access Level & Role</div>
                                <div className="metric-value" style={{ textTransform: 'capitalize' }}>
                                    {user.role === 'seller' ? '🛍️ Merchant / Seller' : '👤 Customer / Buyer'}
                                </div>
                                <div className="metric-sub">Profile: {user.profile || 'Default'}</div>
                            </div>

                            <div className="metric-card">
                                <div className="metric-label">Authorized Site IDs</div>
                                <div className="metric-value">
                                    {user.siteIds && user.siteIds.length > 0 ? user.siteIds.join(', ') : 'All Public Sites'}
                                </div>
                                <div className="metric-sub">Client UUID: {user.clientUuid ? user.clientUuid.substring(0, 14) + '...' : 'N/A'}</div>
                            </div>

                            <div className="metric-card" style={{ borderColor: 'rgba(56, 189, 248, 0.3)' }}>
                                <div className="metric-label" style={{ color: 'var(--accent-glow)' }}>In-Memory Bearer Token</div>
                                <div className="metric-value" style={{ fontSize: '15px', fontFamily: 'monospace', color: '#38bdf8' }}>
                                    {inMemoryToken ? (inMemoryToken.substring(0, 22) + '...') : 'No Token in Memory'}
                                </div>
                                <div className="metric-sub" style={{ color: 'var(--accent-emerald)' }}>
                                    ✓ Saved in JS memory (Zero localStorage)
                                </div>
                            </div>
                        </div>

                        <!-- Live Session & In-Memory Bearer API Test -->
                        <div className="card">
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px', flexWrap: 'wrap', gap: '12px' }}>
                                <div>
                                    <h2 style={{ fontSize: '18px', fontWeight: '700' }}>Active Session & Bearer Header Tester</h2>
                                    <p style={{ fontSize: '13px', color: 'var(--text-muted)' }}>
                                        Received token from cookie exchange at <code>/auth/me</code>. Now calling protected endpoints sending <code>Authorization: Bearer</code> header.
                                    </p>
                                </div>
                                <button onClick={testBearerApi} disabled={isTestingApi || !inMemoryToken} className="btn btn-primary" style={{ fontSize: '13px' }}>
                                    {isTestingApi ? 'Calling API...' : '⚡ Call API with Authorization: Bearer Header'}
                                </button>
                            </div>

                            <div className="code-title-bar">
                                <span>CURRENT USER SESSION PAYLOAD (JSON)</span>
                                <span style={{ color: 'var(--accent-emerald)' }}>HTTP 200 OK</span>
                            </div>
                            <pre className="code-container">
                                {JSON.stringify(user, null, 2)}
                            </pre>

                            {apiTestResult && (
                                <div style={{ marginTop: '16px' }}>
                                    <div className="code-title-bar">
                                        <span>LIVE API CALL RESULT at {apiTestResult.timestamp}</span>
                                        <span style={{ color: apiTestResult.ok ? 'var(--accent-emerald)' : 'var(--accent-rose)' }}>
                                            Status: {apiTestResult.status}
                                        </span>
                                    </div>
                                    <pre className="code-container">
                                        {JSON.stringify(apiTestResult.data, null, 2)}
                                    </pre>
                                </div>
                            )}
                        </div>

                        <!-- SSO Architectural Flow Explained -->
                        <div className="card">
                            <h2 style={{ fontSize: '18px', fontWeight: '700', marginBottom: '8px' }}>
                                How This J2EE ➔ React Single Sign-On Flow Works
                            </h2>
                            <p style={{ fontSize: '13px', color: 'var(--text-muted)' }}>
                                The 4 architectural stages that securely authenticated this React page:
                            </p>
                            
                            <div className="timeline">
                                <div className="timeline-step">
                                    <div className="step-num">1</div>
                                    <div>
                                        <div className="step-title">J2EE Application Authenticates & Signs JWT</div>
                                        <div className="step-desc">
                                            User logs in with credentials. J2EE validates the database and signs a JWT with claims (<code>sub</code>, <code>role</code>, <code>clientUuid</code>) using the shared secret.
                                        </div>
                                    </div>
                                </div>

                                <div className="timeline-step">
                                    <div className="step-num">2</div>
                                    <div>
                                        <div className="step-title">JWT Placed as Parent Domain Cookie</div>
                                        <div className="step-desc">
                                            J2EE writes the cookie <code>wjl_jwt</code> with <code>Path=/</code>, <code>Domain=.wejoinlife.com</code>, <code>SameSite=Lax</code>, and <code>Secure</code>.
                                        </div>
                                    </div>
                                </div>

                                <div className="timeline-step">
                                    <div className="step-num">3</div>
                                    <div>
                                        <div className="step-title">React Requests with <code>credentials: 'include'</code></div>
                                        <div className="step-desc">
                                            When this React page mounted, it called <code>fetch('/wjlapi/api/v1/auth/me', &#123; credentials: 'include' &#125;)</code>. The browser automatically sent the <code>wjl_jwt</code> cookie.
                                        </div>
                                    </div>
                                </div>

                                <div className="timeline-step">
                                    <div className="step-num">4</div>
                                    <div>
                                        <div className="step-title">Spring Boot Filter Validates & Grants Access</div>
                                        <div className="step-desc">
                                            Spring Boot's <code>JwtAuthenticationFilter</code> extracted the token from the cookie, validated the signature, set the <code>SecurityContext</code>, and authorized this response.
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AuthorizedPortal />);
    </script>
</body>
</html>
