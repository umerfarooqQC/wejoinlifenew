server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: wejoinlife-api

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:vconnect_prod_portal}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:devdb}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never # Disabled: will use existing database

application:
  security:
    client-pass-salt: ${CLIENT_PASS_SALT:38fc4120}
    jwt:
      secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration: 86400000
      cookie-name: ${JWT_COOKIE_NAME:wjl_jwt}

  database:
    portal-db: ${PORTAL_DB:vconnect_prod_portal}
    catalog-db: ${CATALOG_DB:vconnect_prod_catalog}
    vconnect-db: ${VCONNECT_DB:vconnect}

  cart:
    cookie-name: ${CART_COOKIE_NAME:vconnect_cart}

  async:
    core-pool-size: ${ASYNC_CORE_POOL_SIZE:10}
    max-pool-size: ${ASYNC_MAX_POOL_SIZE:50}
    queue-capacity: ${ASYNC_QUEUE_CAPACITY:500}
    keep-alive-seconds: ${ASYNC_KEEP_ALIVE_SECONDS:60}
    thread-name-prefix: ${ASYNC_THREAD_PREFIX:wjl-async-}
    await-termination-seconds: ${ASYNC_AWAIT_TERMINATION:30}
